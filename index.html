<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Иван лох</title>

<!-- Нестандартные шрифты с поддержкой кириллицы -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Russo+One&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  /* ФОН, МИГАЮЩИЙ ВСЕМИ ЦВЕТАМИ РАДУГИ */
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Rubik Glitch', cursive;
    animation: rainbow 0.9s linear infinite;
    user-select: none;
  }

  @keyframes rainbow {
    0%   { background: #ff0000; }
    14%  { background: #ff8800; }
    28%  { background: #ffee00; }
    42%  { background: #00ff44; }
    57%  { background: #00ccff; }
    71%  { background: #3300ff; }
    85%  { background: #cc00ff; }
    100% { background: #ff0000; }
  }

  /* ГЛАВНАЯ НАДПИСЬ */
  h1 {
    font-family: 'Rubik Glitch', cursive;
    font-size: clamp(2.5rem, 11vw, 9rem);
    color: #ffffff;
    text-align: center;
    letter-spacing: 0.05em;
    text-shadow:
      0 0 10px #000,
      0 0 25px #000,
      0 0 45px #fff,
      0 0 80px #fff;
    animation: wobble 1.2s ease-in-out infinite;
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(-1.5deg) scale(1); }
    50%      { transform: rotate(1.5deg) scale(1.05); }
  }

  /* КНОПКИ */
  .buttons {
    display: flex;
    gap: 18px;
    margin-top: 50px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 15px;
  }

  button {
    font-family: 'Russo One', sans-serif;
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    padding: 16px 30px;
    border: 3px solid #fff;
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.8);
    color: #fff;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
  }

  button:hover {
    background: #000;
    transform: scale(1.1) rotate(-2deg);
    box-shadow: 0 0 30px #fff;
  }

  button:active {
    transform: scale(0.92);
  }

  /* ОВЕРЛЕЙ С КАКАШКОЙ */
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    background: #3b1f08;
    z-index: 100;
    cursor: pointer;
  }

  #overlay.show { display: flex; }

  #poop {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(60vh, 60vw);
    line-height: 1;
    animation: pop 0.35s cubic-bezier(0.2, 1.6, 0.5, 1);
  }

  @keyframes pop {
    from { transform: scale(0) rotate(-90deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);   opacity: 1; }
  }

  /* ЛЕНТА НОВОСТЕЙ */
  .ticker {
    height: 70px;
    background: #000;
    border-top: 5px solid #ffee00;
    overflow: hidden;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }

  .ticker__inner {
    display: inline-block;
    font-family: 'Russo One', sans-serif;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    color: #00ff44;
    text-shadow: 0 0 10px #00ff44;
    animation: marquee 12s linear infinite;
  }

  @keyframes marquee {
    from { transform: translateX(100vw); }
    to   { transform: translateX(-100%); }
  }
</style>
</head>

<body>

  <h1>ИВАН ЛОХ</h1>

  <div class="buttons">
    <button data-act="1">Кнопка 1</button>
    <button data-act="2">Кнопка 2</button>
    <button data-act="3">Кнопка 3</button>
    <button data-act="4">Кнопка 4</button>
  </div>

  <!-- Оверлей: какашка + бегущая строка -->
  <div id="overlay">
    <div id="poop">💩</div>
    <div class="ticker">
      <div class="ticker__inner" id="tickerText"></div>
    </div>
  </div>

<script>
  const overlay = document.getElementById('overlay');
  const tickerText = document.getElementById('tickerText');

  const MESSAGE = 'ЭТО МЕСТЬ ЗА МОЮ МАМУ';
  // повторяем текст, чтобы лента шла непрерывно
  tickerText.textContent = Array(12).fill(MESSAGE).join('   ★   ') + '   ★   ';

  // любая из четырёх кнопок вызывает одно и то же
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      overlay.classList.add('show');
      // перезапуск анимации появления какашки
      const poop = document.getElementById('poop');
      poop.style.animation = 'none';
      void poop.offsetWidth;
      poop.style.animation = '';
    });
  });

  // клик по оверлею — закрыть
  overlay.addEventListener('click', () => {
    overlay.classList.remove('show');
  });
</script>

</body>
</html>
