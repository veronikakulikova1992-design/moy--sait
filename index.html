<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Иван лох</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Russo+One&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  /* ФОН, МИГАЮЩИЙ ВСЕМИ ЦВЕТАМИ РАДУГИ */
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Rubik Glitch', cursive;
    animation: rainbow 0.9s linear infinite;
    user-select: none;
  }

  @keyframes rainbow {
    0%   { background: #ff0000; }
    14%  { background: #ff8800; }
    28%  { background: #ffee00; }
    42%  { background: #00ff44; }
    57%  { background: #00ccff; }
    71%  { background: #3300ff; }
    85%  { background: #cc00ff; }
    100% { background: #ff0000; }
  }

  /* ГЛАВНАЯ НАДПИСЬ */
  h1 {
    font-family: 'Rubik Glitch', cursive;
    font-size: clamp(2.5rem, 11vw, 9rem);
    color: #fff;
    text-align: center;
    letter-spacing: 0.05em;
    text-shadow:
      0 0 10px #000, 0 0 25px #000,
      0 0 45px #fff, 0 0 80px #fff;
    animation: wobble 1.2s ease-in-out infinite;
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(-1.5deg) scale(1); }
    50%      { transform: rotate(1.5deg) scale(1.05); }
  }

  /* КНОПКИ */
  .buttons {
    display: flex;
    gap: 22px;
    margin-top: 55px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 15px;
    perspective: 800px;
  }

  button {
    font-family: 'Russo One', sans-serif;
    font-size: clamp(0.95rem, 2vw, 1.25rem);
    padding: 18px 34px;
    border: none;
    border-radius: 20px;
    color: #fff;
    cursor: pointer;
    position: relative;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    transition: transform 0.12s ease, box-shadow 0.15s ease, filter 0.15s ease;
    animation: btnFloat 2.5s ease-in-out infinite;
  }

  button:nth-child(1) {
    background: linear-gradient(135deg, #ff0080, #ff8c00);
    box-shadow:
      0 6px 0 #800040,
      0 10px 30px rgba(255, 0, 128, 0.55),
      inset 0 2px 0 rgba(255,255,255,0.35),
      inset 0 -4px 0 rgba(0,0,0,0.25);
    animation-delay: 0s;
  }
  button:nth-child(2) {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    box-shadow:
      0 6px 0 #003a80,
      0 10px 30px rgba(0, 114, 255, 0.55),
      inset 0 2px 0 rgba(255,255,255,0.35),
      inset 0 -4px 0 rgba(0,0,0,0.25);
    animation-delay: 0.3s;
  }
  button:nth-child(3) {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    box-shadow:
      0 6px 0 #1a6b3f,
      0 10px 30px rgba(67, 233, 123, 0.55),
      inset 0 2px 0 rgba(255,255,255,0.35),
      inset 0 -4px 0 rgba(0,0,0,0.25);
    animation-delay: 0.6s;
    color: #07321d;
    text-shadow: 0 1px 2px rgba(255,255,255,0.4);
  }
  button:nth-child(4) {
    background: linear-gradient(135deg, #a044ff, #6a00ff);
    box-shadow:
      0 6px 0 #3b0090,
      0 10px 30px rgba(160, 68, 255, 0.55),
      inset 0 2px 0 rgba(255,255,255,0.35),
      inset 0 -4px 0 rgba(0,0,0,0.25);
    animation-delay: 0.9s;
  }

  @keyframes btnFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-6px) rotate(-1deg); }
  }

  button:hover {
    transform: translateY(-4px) scale(1.07) rotate(1.5deg);
    filter: brightness(1.15) saturate(1.2);
  }

  button:active {
    transform: translateY(4px) scale(0.96);
  }

  /* ОВЕРЛЕЙ — СКРИМЕР */
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    background: #000;
    z-index: 100;
    cursor: pointer;
    overflow: hidden;
  }

  #overlay.show {
    display: flex;
    animation: screenShake 0.1s linear infinite;
  }

  /* Красная виньетка для жути */
  #overlay::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 30%, rgba(150,0,0,0.55) 100%);
    pointer-events: none;
    animation: vignettePulse 0.4s ease-in-out infinite alternate;
    z-index: 2;
  }

  @keyframes vignettePulse {
    from { opacity: 0.6; }
    to   { opacity: 1; }
  }

  @keyframes screenShake {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(-4px, 3px); }
    50%      { transform: translate(4px, -3px); }
    75%      { transform: translate(-3px, -4px); }
  }

  #emojiWrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    animation: popIn 0.3s cubic-bezier(0.2, 1.6, 0.5, 1) forwards;
  }

  #emoji {
    font-size: min(55vh, 55vw);
    line-height: 1;
    display: inline-block;
    filter: drop-shadow(0 0 30px #ff0000) drop-shadow(0 0 60px #ff0000);
    animation: tremble 0.09s linear infinite;
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  @keyframes tremble {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1.15); }
    20%  { transform: translate(-8px, 6px) rotate(-3deg) scale(1.2); }
    40%  { transform: translate(7px, -9px) rotate(3deg) scale(1.12); }
    60%  { transform: translate(-6px, -6px) rotate(-2deg) scale(1.22); }
    80%  { transform: translate(9px, 7px) rotate(4deg) scale(1.14); }
    100% { transform: translate(0, 0) rotate(0deg) scale(1.15); }
  }

  /* ЛЕНТА НОВОСТЕЙ */
  .ticker {
    height: 70px;
    background: #000;
    border-top: 5px solid #ffee00;
    overflow: hidden;
    display: flex;
    align-items: center;
    white-space: nowrap;
    z-index: 3;
  }

  .ticker__inner {
    display: inline-block;
    font-family: 'Russo One', sans-serif;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    color: #ff1a1a;
    text-shadow: 0 0 12px #ff0000, 0 0 25px #ff0000;
    animation: marquee 12s linear infinite;
  }

  @keyframes marquee {
    from { transform: translateX(100vw); }
    to   { transform: translateX(-100%); }
  }
</style>
</head>

<body>

  <h1>ИВАН ЛОХ</h1>

  <div class="buttons">
    <button data-emoji="💩">Тыкни</button>
    <button data-emoji="👹">Получишь приз</button>
    <button data-emoji="💩">Жми</button>
    <button data-emoji="👹">Тут 1000$</button>
  </div>

  <div id="overlay">
    <div id="emojiWrapper">
      <span id="emoji">💩</span>
    </div>
    <div class="ticker">
      <div class="ticker__inner" id="tickerText"></div>
    </div>
  </div>

<script>
  const overlay = document.getElementById('overlay');
  const emojiEl = document.getElementById('emoji');
  const tickerText = document.getElementById('tickerText');

  const MESSAGE = 'ЭТО МЕСТЬ ЗА МОЮ МАМУ';
  tickerText.textContent = Array(12).fill(MESSAGE).join('   ★   ') + '   ★   ';

  // Переиспользуем один AudioContext
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playScarySound() {
    const ctx = getCtx();
    const now = ctx.currentTime;

    // 1. Низкий "бум"
    const boom = ctx.createOscillator();
    boom.type = 'sine';
    boom.frequency.setValueAtTime(160, now);
    boom.frequency.exponentialRampToValueAtTime(22, now + 0.7);
    const boomGain = ctx.createGain();
    boomGain.gain.setValueAtTime(0.55, now);
    boomGain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
    boom.connect(boomGain).connect(ctx.destination);
    boom.start(now);
    boom.stop(now + 0.9);

    // 2. Скрип / визг
    const screech = ctx.createOscillator();
    screech.type = 'sawtooth';
    screech.frequency.setValueAtTime(1400, now);
    screech.frequency.exponentialRampToValueAtTime(180, now + 1.1);
    const screechGain = ctx.createGain();
    screechGain.gain.setValueAtTime(0.18, now);
    screechGain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
    screech.connect(screechGain).connect(ctx.destination);
    screech.start(now);
    screech.stop(now + 1.1);

    // 3. Шумовой всплеск (страшный "шшш")
    const bufSize = Math.floor(ctx.sampleRate * 0.5);
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 900;
    noiseFilter.Q.value = 2;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.35, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
    noise.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);
    noise.start(now);

    // 4. Зловещий гул (для атмосферы)
    const drone = ctx.createOscillator();
    drone.type = 'triangle';
    drone.frequency.setValueAtTime(55, now);
    const droneGain = ctx.createGain();
    droneGain.gain.setValueAtTime(0.001, now);
    droneGain.gain.exponentialRampToValueAtTime(0.15, now + 0.2);
    droneGain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
    drone.connect(droneGain).connect(ctx.destination);
    drone.start(now);
    drone.stop(now + 1.8);
  }

  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      // ставим нужный смайлик
      emojiEl.textContent = btn.dataset.emoji;
      overlay.classList.add('show');

      // перезапуск анимации появления
      const wrapper = document.getElementById('emojiWrapper');
      wrapper.style.animation = 'none';
      void wrapper.offsetWidth;
      wrapper.style.animation = '';

      playScarySound();
    });
  });

  overlay.addEventListener('click', () => {
    overlay.classList.remove('show');
  });
</script>

</body>
</html>
